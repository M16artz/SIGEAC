      responses:
        '200':
          description: Historial documental append-only.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DocumentReviewView'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [DocumentReview]
      operationId: decideDocumentReview
      parameters: [{$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentReviewCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /document-review-inbox:
    get:
      tags: [DocumentReview]
      operationId: listDocumentReviewInbox
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /processes/{processId}/indicators/{indicatorId}/academic-evaluations:
    get:
      tags: [AcademicEvaluation]
      operationId: listAcademicEvaluationHistory
      parameters:
        - {$ref: '#/components/parameters/ProcessId'}
        - {$ref: '#/components/parameters/IndicatorId'}
      responses:
        '200':
          description: Historial académico separado del documental.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AcademicEvaluationView'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [AcademicEvaluation]
      operationId: decideAcademicEvaluation
      parameters:
        - {$ref: '#/components/parameters/ProcessId'}
        - {$ref: '#/components/parameters/IndicatorId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AcademicEvaluationCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /academic-evaluation-inbox:
    get:
      tags: [AcademicEvaluation]
      operationId: listAcademicEvaluationInbox
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /audit-events:
    get:
      tags: [Audit]
      operationId: searchEvidenceAuditEvents
      parameters:
        - $ref: '#/components/parameters/ProcessIdQueryOptional'
        - {name: evidenceId, in: query, schema: {type: string, format: uuid}}
        - {name: versionId, in: query, schema: {type: string, format: uuid}}
        - {name: action, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string}}
        - {name: correlationId, in: query, schema: {type: string, minLength: 8, maxLength: 64}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Scope-filtered immutable audit events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /exchange-packages/validate:
    post:
      tags: [Extensions]
      operationId: validateExchangePackage
      description: Extensión I7; no requerida para operar I0-I6.
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExchangePackage'}
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        '422': {$ref: '#/components/responses/Unprocessable'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SEC_SESSION
  parameters:
    CsrfToken: {name: X-CSRF-TOKEN, in: header, required: true, schema: {type: string, minLength: 32}}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the latest resource representation; planning mutations use the process revision.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    ModelId: {name: modelId, in: path, required: true, schema: {type: string, format: uuid}}
    TeamId: {name: teamId, in: path, required: true, schema: {type: string, format: uuid}}
    ActivityId: {name: activityId, in: path, required: true, schema: {type: string, format: uuid}}
    ProcessId: {name: processId, in: path, required: true, schema: {type: string, format: uuid}}
    EvidenceId: {name: evidenceId, in: path, required: true, schema: {type: string, format: uuid}}
    VersionId: {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
    IndicatorId: {name: indicatorId, in: path, required: true, schema: {type: string, format: uuid}}
    FileId: {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
    ReferenceId:
      name: referenceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProcessIdQuery:
      name: processId
      in: query
      required: true
      schema: {type: string, format: uuid}
    ProcessIdQueryOptional:
      name: processId
      in: query
      schema: {type: string, format: uuid}
    IndicatorIdQuery: {name: indicatorId, in: query, schema: {type: string, format: uuid}}
    ReportId: {name: reportId, in: path, required: true, schema: {type: string, format: uuid}}
  headers:
    ETag:
      description: Strong resource revision tag; planning responses identify the process revision.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    Location:
      description: URI of the created resource.
      schema: {type: string, format: uri-reference}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 100}
        password: {type: string, minLength: 12, maxLength: 256}
    SessionView:
      type: object
      required: [userId, expiresAt, csrfToken]
      properties:
        userId: {type: string, format: uuid}
        expiresAt: {type: string, format: date-time}
        csrfToken: {type: string}
    CurrentIdentity:
      type: object
      required: [id, displayName, technical, assignments]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        technical: {type: boolean}
        assignments: {type: array, items: {$ref: '#/components/schemas/AssignmentView'}}
    UserView:
      type: object
      additionalProperties: false
      required: [id, username, displayName, technical, active, revision]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        displayName: {type: string}
        technical: {type: boolean}
        active: {type: boolean}
        revision: {type: integer, minimum: 0}
    AssignmentView:
      type: object
      additionalProperties: false
      required: [id, roleCode, roleName, careerId, validFrom, validTo]
      properties:
        id: {type: string, format: uuid}
        roleCode: {type: string}
        roleName: {type: string}
        careerId: {type: string, format: uuid}
        processId: {type: [string, 'null'], format: uuid}
        indicatorId: {type: [string, 'null'], format: uuid}
        validFrom: {type: string, format: date-time}
        validTo: {type: string, format: date-time}
    UserStateCommand:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active: {type: boolean}
    ConflictExceptionCommand:
      type: object
      additionalProperties: false
      required: [policyId, targetUserId, careerId, justification, validFrom, validTo]
      properties:
        policyId: {type: string, format: uuid}
        targetUserId: {type: string, format: uuid}
        careerId: {type: string, format: uuid}
        processId: {type: [string, 'null'], format: uuid}
        indicatorId: {type: [string, 'null'], format: uuid}
        justification: {type: string, minLength: 10, maxLength: 1000}
        validFrom: {type: string, format: date-time}
        validTo: {type: string, format: date-time}
    UserCommand:
      type: object
      additionalProperties: false
      required: [username, displayName, initialPassword]
      properties:
        username: {type: string, minLength: 3, maxLength: 100}
        displayName: {type: string, minLength: 1, maxLength: 200}
        initialPassword: {type: string, minLength: 12, maxLength: 256}
        technical: {type: boolean}
    AssignmentCommand:
      type: object
      additionalProperties: false
      required: [roleCode, careerId, validFrom]
      properties:
        roleCode: {type: string}
        careerId: {type: string, format: uuid}
        processId: {type: [string, 'null'], format: uuid}
        indicatorId: {type: [string, 'null'], format: uuid}
        validFrom: {type: string, format: date-time}
        validUntil: {type: [string, 'null'], format: date-time}
        exceptionReason: {type: [string, 'null'], minLength: 10, maxLength: 1000}
    ModelCommand:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Z0-9_-]{2,40}$'}
        name: {type: string, minLength: 3, maxLength: 200}
    ModelVersionCommand:
      type: object
      additionalProperties: false
      required: [sourceReference, criteria, ratingOptions, progressFormula]
      properties:
        sourceReference: {type: string, minLength: 3, maxLength: 500}
        criteria: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CriterionCommand'}}
        ratingOptions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RatingOptionCommand'}}
        progressFormula: {$ref: '#/components/schemas/ProgressFormulaCommand'}
    CriterionCommand:
      type: object
      additionalProperties: false
      required: [code, title, ordinal, standards]
      properties:
        code: {type: string, pattern: '^[A-Z0-9_.-]{1,40}$'}
