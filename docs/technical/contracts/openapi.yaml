openapi: 3.1.0
info:
  title: SEC-UNL API
  version: 1.0.0
  description: Contrato común v1 del Sistema de Evaluación de Carreras. D1 incorpora carreras/unidades; las operaciones aún planificadas no prueban disponibilidad del backend. Los cambios incompatibles futuros de 005 se separan en v2; no sustituyen silenciosamente DTO v1. D1-D6 forman el MVP documental y D7-D8 completan el ciclo.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Access
  - name: Models
  - name: Processes
  - name: Evidence
  - name: DocumentReview
  - name: AcademicEvaluation
  - name: Reporting
  - name: Audit
  - name: Extensions
paths:
  /academic-units:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1academic-units'
  /academic-units/{unitId}:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1academic-units~1{unitId}'
  /academic-units/{unitId}/state-decisions:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1academic-units~1{unitId}~1state-decisions'
  /careers:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1careers'
  /careers/access:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1careers~1access'
  /careers/{careerId}:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1careers~1{careerId}'
  /careers/{careerId}/history:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1careers~1{careerId}~1history'
  /careers/{careerId}/state-decisions:
    $ref: '../../../specs/005-complete-evaluation-workflows/contracts/openapi.yaml#/paths/~1careers~1{careerId}~1state-decisions'
  /sessions:
    post:
      tags: [Access]
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '201':
          description: Sesión creada; establece cookie opaca y devuelve token CSRF.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Access]
      operationId: revokeCurrentSession
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Sesión revocada}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me:
    get:
      tags: [Access]
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Identidad, funciones y ámbitos vigentes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentIdentity'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /users:
    get:
      tags: [Access]
      operationId: listUsers
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Access]
      operationId: createUser
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{userId}:
    patch:
      tags: [Access]
      operationId: changeUserState
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserStateCommand'}
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /users/{userId}/assignments:
    get:
      tags: [Access]
      operationId: listUserAssignments
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200':
          description: Asignaciones del usuario visibles en el ámbito administrativo.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AssignmentView'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Access]
      operationId: assignUserScope
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssignmentCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /conflict-exceptions:
    post:
      tags: [Access]
      operationId: createConflictException
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConflictExceptionCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /models:
    get:
      tags: [Models]
      operationId: listModels
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Models]
      operationId: createModel
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /models/{modelId}/versions:
    get:
      tags: [Models]
      operationId: listModelVersions
      description: El contrato v1 conserva la jerarquía legada; una versión con nodos tipados devuelve MODEL_VERSION_REQUIRES_V2 y no se proyecta perdiendo información.
      parameters:
        - {$ref: '#/components/parameters/ModelId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    post:
      tags: [Models]
      operationId: createModelVersion
      parameters:
        - {$ref: '#/components/parameters/ModelId'}
        - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelVersionCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '409': {$ref: '#/components/responses/Conflict'}
  /model-versions/{versionId}/publish:
    post:
      tags: [Models]
      operationId: publishModelVersion
      parameters:
        - {$ref: '#/components/parameters/VersionId'}
        - {$ref: '#/components/parameters/CsrfToken'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /model-versions/{versionId}:
    get:
      tags: [Models]
      operationId: getModelVersion
      description: Una versión con nodos tipados requiere el contrato v2 planificado y devuelve 409 MODEL_VERSION_REQUIRES_V2 en v1.
      parameters: [{$ref: '#/components/parameters/VersionId'}]
      responses:
        '200':
          description: Versión completa del modelo filtrada por ámbito.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelVersionView'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    put:
      tags: [Models]
      operationId: replaceModelVersionDraft
      parameters: [{$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ModelVersionCommand'}
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /model-versions/{versionId}/successors:
    post:
      tags: [Models]
      operationId: createModelVersionSuccessor
      parameters: [{$ref: '#/components/parameters/VersionId'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '409': {$ref: '#/components/responses/Conflict'}
  /model-versions/compare:
    get:
      tags: [Models]
      operationId: compareModelVersions
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: to, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 'Diferencias agregadas, eliminadas, modificadas y sin cambio'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /model-audit-events:
    get:
      tags: [Models, Audit]
      operationId: searchModelAuditEvents
      parameters:
        - {name: modelId, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: versionId, in: query, required: false, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /processes:
    get:
      tags: [Processes]
      operationId: listProcesses
      responses:
        '200':
          description: Procesos visibles dentro del ámbito autorizado; listado actual sin paginación.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProcessView'}}
    post:
      tags: [Processes]
      operationId: createProcess
      parameters: [{$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessCommand'}
      responses:
        '201': {$ref: '#/components/responses/CreatedResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /processes/{processId}:
    get:
      tags: [Processes]
      operationId: getProcess
      parameters: [{$ref: '#/components/parameters/ProcessId'}]
      responses:
        '200':
          description: Proceso y referencia inmutable de modelo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessView'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /processes/{processId}/indicators:
    get:
      tags: [Processes]
      operationId: listProcessIndicators
      parameters:
        - {$ref: '#/components/parameters/ProcessId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/PagedResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /processes/{processId}/authorizations:
    post:
      tags: [Processes]
      operationId: recordProcessStartAuthorization
      description: Registra una decisión humana de inicio. Verifica asignación propia, activa, con PROCESS_AUTHORIZE y ámbito suficiente; no concede acreditación. Adaptador inicial, no sustituye el contrato completo de decisiones de 005.
      x-implementation-status: partial
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessStartAuthorizationCommand'}
      responses:
        '201':
          description: Autorización registrada; el proceso continúa en preparación y su revisión aumenta.
          headers:
            ETag: {description: Revisión fuerte del proceso, schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessStartAuthorizationView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /processes/{processId}/activate:
    post:
      tags: [Processes]
      operationId: activateProcess
      description: Requiere preparación, autorización institucional registrada y modelo con indicadores. No admite activación mediante transiciones genéricas.
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {$ref: '#/components/responses/Resource'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /processes/{processId}/assignments:
    get:
      tags: [Processes]
      operationId: listProcessAssignments
      parameters: [{$ref: '#/components/parameters/ProcessId'}]
      responses:
        '200':
          description: Planificadores ven el historial; participantes solo asignaciones vigentes con permiso independiente.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProcessAssignmentView'}}
    post:
      tags: [Processes]
      operationId: createProcessAssignment
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessAssignmentCommand'}
      responses:
        '201':
          description: Asignacion creada; ETag corresponde a la nueva revision del proceso.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessAssignmentView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
  /processes/{processId}/teams:
    get:
      tags: [Processes]
      operationId: listProcessTeams
      description: Solo coordinacion o administracion del proceso.
      parameters: [{$ref: '#/components/parameters/ProcessId'}]
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProcessTeamView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Processes]
      operationId: createProcessTeam
      description: Solo coordinacion o administracion del proceso.
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessTeamCommand'}
      responses:
        '201':
          description: Recurso creado; ETag identifica la nueva revision del proceso.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessTeamView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /teams/{teamId}/memberships:
    get:
      tags: [Processes]
      operationId: listTeamMemberships
      description: Solo planificadores; cada integrante conserva su asignacion individual.
      parameters: [{$ref: '#/components/parameters/TeamId'}]
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TeamMembershipView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Processes]
      operationId: addTeamMembership
      description: Solo planificadores; cada integrante conserva su asignacion individual.
      parameters: [{$ref: '#/components/parameters/TeamId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamMembershipCommand'}
      responses:
        '201':
          description: Recurso creado; ETag identifica la nueva revision del proceso.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamMembershipView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /processes/{processId}/activities:
    get:
      tags: [Processes]
      operationId: listProcessActivities
      description: Planificadores ven todas; participantes solo sus actividades con asignacion y permiso vigentes, incluida membresia verificada de equipo.
      parameters: [{$ref: '#/components/parameters/ProcessId'}]
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProcessActivityView'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Processes]
      operationId: createProcessActivity
      description: Planificadores ven todas; participantes solo sus actividades con asignacion y permiso vigentes, incluida membresia verificada de equipo.
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessActivityCommand'}
      responses:
        '201':
          description: Recurso creado; ETag identifica la nueva revision del proceso.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessActivityView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /teams/{teamId}:
    get:
      tags: [Processes]
      operationId: getProcessTeam
      description: Consulta limitada a planificadores del proceso.
      parameters: [{$ref: '#/components/parameters/TeamId'}]
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessTeamView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /activities/{activityId}:
    get:
      tags: [Processes]
      operationId: getProcessActivity
      description: Misma autorizacion que el listado; inexistente y ajena devuelven 404 indistinguible.
      parameters: [{$ref: '#/components/parameters/ActivityId'}]
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessActivityView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Processes]
      operationId: updateProcessActivity
      description: Solo planificadores; If-Match corresponde a la revision del proceso y se conserva el historial de la actividad.
      parameters: [{$ref: '#/components/parameters/ActivityId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessActivityCommand'}
      responses:
        '200':
          description: Consulta o actualizacion autorizada.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessActivityView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /processes/{processId}/reopen:
    post:
      tags: [Processes]
      operationId: reopenProcess
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessDecisionCommand'}
      responses:
        '200':
          description: Proceso actualizado con decision autorizada y revision incrementada.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /processes/{processId}/transitions:
    post:
      tags: [Processes]
      operationId: transitionProcess
      description: Suspensión/reanudación justificadas. CLOSING, CLOSED y DOCUMENTARY_CLOSED se rechazan con CLOSURE_POLICY_REQUIRED hasta disponer de su política y snapshot. La reapertura requiere también PROCESS_AUTHORIZE.
      parameters: [{$ref: '#/components/parameters/ProcessId'}, {$ref: '#/components/parameters/CsrfToken'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProcessTransitionCommand'}
      responses:
        '200':
          description: Proceso actualizado con decision autorizada y revision incrementada.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessView'}
        '400': {$ref: '#/components/responses/BadRequest'}
