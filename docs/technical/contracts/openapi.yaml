              description: SHA-256 digest of the delivered bytes.
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/IntegrityConflict'}
  /evidence-versions/{versionId}/external-references:
