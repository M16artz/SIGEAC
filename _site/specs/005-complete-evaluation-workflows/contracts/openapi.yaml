openapi: "3.1.0"
info:
  title: "SEC-UNL — Contrato planificado de procesos completos"
  version: "2.0.0-draft"
  description: "Contrato de P02–P16. El catálogo D1 de carreras/unidades está implementado y sobrescribe su servidor a
    /api/v1. El resto es objetivo planificado bajo /api/v2 y no afirma disponibilidad del backend. Los DTO y operaciones
    v1 anteriores se conservan en docs/technical/contracts/openapi.yaml y specs/001–004/contracts. Ver README.md y
    ADR-0018 para compatibilidad. Migración coordinada pre-release 2026-11-08: las respuestas JSON usan
    success/message/data/errors/meta; la paginación viaja en meta. 204/304, HEAD, binarios y documentos de protocolo no
    se envuelven. Bearer OIDC es opcional; las sesiones conservan CSRF."
  x-response-envelope: true
servers:
  - url: "/api/v2"
security:
  - sessionCookie: []
