# Install valid certificates and the backend CA at the paths below before use.
events { worker_connections 1024; }
http {
    log_format api '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $request_time';
    access_log /var/log/nginx/access.log api;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;
    map $status $retry_after { default ""; 429 60; 503 60; }
    client_max_body_size 26m;
    server_tokens off;
    upstream sec_backend { server 127.0.0.1:8443; keepalive 16; }
    server {
        listen 80;
        default_type application/json;
        add_header Upgrade TLS/1.2 always;
        return 426 '{"success":false,"message":"Utilice HTTPS.","data":null,"errors":{"type":"urn:sec-unl:problem:https-required","title":"Upgrade Required","status":426,"detail":"Utilice HTTPS.","instance":"about:blank","code":"HTTPS_REQUIRED","correlationId":"$request_id","details":{}},"meta":{}}';
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/tls/api.crt;
        ssl_certificate_key /etc/nginx/tls/api.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security 'max-age=31536000' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header X-Correlation-ID $request_id always;
        proxy_hide_header X-Correlation-ID;
        add_header Retry-After $retry_after always;
        error_page 429 = @limited;
        error_page 413 = @too_large;
        error_page 502 = @bad_gateway;
        error_page 503 = @unavailable;
        error_page 504 = @timeout;
        location @limited {
            default_type application/json;
            return 429 '{"success":false,"message":"Demasiadas solicitudes.","data":null,"errors":{"type":"urn:sec-unl:problem:rate-limit-exceeded","title":"Too Many Requests","status":429,"detail":"Demasiadas solicitudes.","instance":"about:blank","code":"RATE_LIMIT_EXCEEDED","correlationId":"$request_id","details":{}},"meta":{}}';
        }
        location @too_large {
            default_type application/json;
            return 413 '{"success":false,"message":"Solicitud demasiado grande.","data":null,"errors":{"type":"urn:sec-unl:problem:file-too-large","title":"Payload Too Large","status":413,"detail":"Solicitud demasiado grande.","instance":"about:blank","code":"FILE_TOO_LARGE","correlationId":"$request_id","details":{}},"meta":{}}';
        }
        location @bad_gateway {
            default_type application/json;
            return 502 '{"success":false,"message":"No se pudo contactar con el backend.","data":null,"errors":{"type":"urn:sec-unl:problem:bad-gateway","title":"Bad Gateway","status":502,"detail":"No se pudo contactar con el backend.","instance":"about:blank","code":"BAD_GATEWAY","correlationId":"$request_id","details":{}},"meta":{}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"success":false,"message":"Servicio no disponible temporalmente.","data":null,"errors":{"type":"urn:sec-unl:problem:service-unavailable","title":"Service Unavailable","status":503,"detail":"Servicio no disponible temporalmente.","instance":"about:blank","code":"SERVICE_UNAVAILABLE","correlationId":"$request_id","details":{}},"meta":{}}';
        }
        location @timeout {
            default_type application/json;
            return 504 '{"success":false,"message":"El backend no respondió a tiempo.","data":null,"errors":{"type":"urn:sec-unl:problem:gateway-timeout","title":"Gateway Timeout","status":504,"detail":"El backend no respondió a tiempo.","instance":"about:blank","code":"GATEWAY_TIMEOUT","correlationId":"$request_id","details":{}},"meta":{}}';
        }
        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://sec_backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/backend-ca.pem;
            proxy_ssl_server_name on;
            proxy_ssl_name sec-backend.local;
            proxy_set_header Host sec-backend.local;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
        location = /api/v1/sessions {
            limit_req zone=login burst=5 nodelay;
            proxy_pass https://sec_backend;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/nginx/tls/backend-ca.pem;
            proxy_ssl_server_name on;
            proxy_ssl_name sec-backend.local;
            proxy_set_header Host sec-backend.local;
            proxy_set_header X-Correlation-ID $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { return 404; }
    }
}
