spring:
  application:
    name: sec-unl
  datasource:
    url: ${SEC_DB_URL:jdbc:postgresql://localhost:5432/sec_unl}
    username: ${SEC_DB_USER:sec_app}
    password: ${SEC_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
server:
  servlet:
    context-path: /api/v1
management:
  endpoints.web.exposure.include: health,info
sec:
  evaluation-model:
    formula-schema: ${SEC_FORMULA_SCHEMA:sec.progress/v1}
    code-normalization: ${SEC_MODEL_CODE_NORMALIZATION:TRIM_UPPER}
  identity-access:
    session-idle-timeout: PT30M
    failed-attempt-window: PT15M
    failed-attempt-limit: 5
    bcrypt-strength: 12
    cookie-secure: ${SEC_COOKIE_SECURE:false}
    subject-hmac-secret: ${SEC_AUTH_HMAC_SECRET:${random.value}}
  files:
    root: ${SEC_FILE_ROOT:./var/files}
    max-bytes: 26214400
    validation-policy-id: ${SEC_FILE_VALIDATION_POLICY:pilot-synthetic-v1}
    reconciliation:
      grace: ${SEC_FILE_RECONCILIATION_GRACE:PT15M}
      lease: ${SEC_FILE_RECONCILIATION_LEASE:PT2M}
  demo-data: ${SEC_DEMO_DATA:false}
