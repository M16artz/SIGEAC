project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - feature-map.md
    - docs/**/*.qmd
    - docs/**/*.md
    - specs/**/*.md
    - tests/acceptance/results/*.md
    - tests/performance/README.md
    - tests/fixtures/**/*.md
    - .specify/memory/constitution.md
  resources:
    - feature-map.md
    - graphify-out/GRAPH_REPORT.md
    - securityOutputs/run-1/*.md
    - securityOutputs/run-1/*.json
    - docs/audit/*-check.json
    - docs/diagrams/*.dsl
    - docs/diagrams/*.puml
    - docs/diagrams/*.bpmn
    - docs/technical/contracts/*.yaml
    - specs/**/contracts/*.yaml

