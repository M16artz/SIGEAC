openapi: 3.1.0
info:
  {
    title: SEC-UNL I0 Access API,
    version: 1.0.0,
    x-response-envelope: true,
    description: " Migración coordinada pre-release 2026-11-08: las respuestas JSON usan success/message/data/errors/meta;
      la paginación viaja en meta. 204/304, HEAD, binarios y documentos de protocolo no se envuelven. Bearer OIDC es
      opcional; las sesiones conservan CSRF."
  }
servers: [ { url: /api/v1 } ]
paths:
  /sessions:
    post:
      operationId: createSession
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        {
          '201':
            {
              description: Session created,
              content: { application/json: { schema: { $ref: "#/components/schemas/SessionViewResponse" } } }
            },
          '401': { $ref: '#/components/responses/Unauthorized' },
          '429': { $ref: '#/components/responses/TooManyRequests' },
          "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
          "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired }
        }
    delete:
      {
        operationId: revokeCurrentSession,
        responses:
          {
            '204': { description: Revoked },
            '401': { $ref: '#/components/responses/Unauthorized' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /me:
    get:
      {
        operationId: getCurrentIdentity,
        responses:
          {
            '200':
              {
                description: Current identity,
                content: { application/json: { schema: { $ref: "#/components/schemas/CurrentIdentityResponse" } } }
              },
            '401': { $ref: '#/components/responses/Unauthorized' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /users:
    get:
      {
        operationId: listUsers,
        responses:
          {
            '200': { description: Scope filtered users },
            '403': { $ref: '#/components/responses/Forbidden' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
    post:
      {
        operationId: createUser,
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCommand' } } } },
        responses:
          {
            '201': { description: Created },
            '403': { $ref: '#/components/responses/Forbidden' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /users/{userId}:
    patch:
      {
        operationId: updateUserState,
        parameters: [ { $ref: '#/components/parameters/UserId' }, { $ref: '#/components/parameters/IfMatch' } ],
        responses:
          {
            '200': { description: Updated },
            '404': { $ref: '#/components/responses/NotFound' },
            '412': { $ref: '#/components/responses/PreconditionFailed' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /users/{userId}/assignments:
    get:
      {
        operationId: listUserAssignments,
        parameters: [ { $ref: '#/components/parameters/UserId' } ],
        responses:
          {
            '200': { description: Assignments },
            '404': { $ref: '#/components/responses/NotFound' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
    post:
      {
        operationId: createUserAssignment,
        parameters: [ { $ref: '#/components/parameters/UserId' } ],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentCommand' } } } },
        responses:
          {
            '201': { description: Created },
            '404': { $ref: '#/components/responses/NotFound' },
            '409': { description: Conflict },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /conflict-exceptions:
    post:
      {
        operationId: createConflictException,
        responses:
          {
            '201': { description: Finite authorized exception },
            '403': { $ref: '#/components/responses/Forbidden' },
            '409': { description: No applicable conflict },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
  /audit-events:
    get:
      {
        operationId: searchAccessAuditEvents,
        responses:
          {
            '200': { description: Scope-filtered immutable events },
            '403': { $ref: '#/components/responses/Forbidden' },
            "400": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiBadRequest },
            "426": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiHttpsRequired },
            "429": { $ref: ../../../docs/technical/contracts/openapi.yaml#/components/responses/ApiRateLimit }
          }
      }
components:
  securitySchemes:
    {
      sessionCookie: { type: apiKey, in: cookie, name: SEC_SESSION },
      bearerAuth:
        {
          type: http,
          scheme: bearer,
          bearerFormat: JWT,
          description: "Opcional: solo cuando SEC_OIDC_ENABLED=true; emisor, audiencia e identidad local activa obligatorios."
        }
    }
  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string } }
  schemas:
    LoginRequest:
      {
        type: object,
        additionalProperties: false,
        required: [ login, password ],
        properties: { login: { type: string, maxLength: 254 }, password: { type: string, maxLength: 256 } }
      }
    SessionView:
      {
        type: object,
        required: [ csrfToken, expiresAt ],
        properties: { csrfToken: { type: string }, expiresAt: { type: string, format: date-time } }
      }
    CurrentIdentity:
      {
        type: object,
        required: [ id, displayName, assignments ],
        properties:
          {
            id: { type: string, format: uuid },
            displayName: { type: string },
            assignments: { type: array, items: { type: object } }
          }
      }
    UserCommand:
      {
        type: object,
        required: [ login, displayName, password ],
        properties:
          {
            login: { type: string },
            displayName: { type: string },
            password: { type: string, minLength: 12 },
            technical: { type: boolean, default: false }
          }
      }
    AssignmentCommand:
      {
        type: object,
        required: [ functionId, careerId, validFrom, validTo ],
        properties:
          {
            functionId: { type: string, format: uuid },
            careerId: { type: string, format: uuid },
            processId: { type: [ string, 'null' ], format: uuid },
            indicatorId: { type: [ string, 'null' ], format: uuid },
            validFrom: { type: string, format: date-time },
            validTo: { type: string, format: date-time }
          }
      }
    Problem:
      $ref: ../../../docs/technical/contracts/openapi.yaml#/components/schemas/Problem
    ApiEnvelope:
      $ref: ../../../docs/technical/contracts/openapi.yaml#/components/schemas/ApiEnvelope
    ApiErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            success:
              const: false
            data:
              type: "null"
            errors:
              $ref: "#/components/schemas/Problem"
            meta:
              type: object
    SessionViewResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: "#/components/schemas/SessionView"
            errors:
              type: "null"
            meta:
              type: object
    CurrentIdentityResponse:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelope"
        - type: object
          properties:
            success:
              const: true
            data:
              $ref: "#/components/schemas/CurrentIdentity"
            errors:
              type: "null"
            meta:
              type: object
  responses:
    Unauthorized:
      {
        description: Authentication required,
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } }
      }
    Forbidden:
      {
        description: Collection capability denied,
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } }
      }
    NotFound:
      {
        description: Unknown or hidden,
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } }
      }
    TooManyRequests:
      {
        description: Temporarily limited,
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } }
      }
    PreconditionFailed:
      {
        description: Stale revision,
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } }
      }
security: [ { sessionCookie: [] } ]
