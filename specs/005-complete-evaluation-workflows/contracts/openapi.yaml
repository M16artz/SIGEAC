components:
  responses:
    UnauthorizedRead:
      description: Sesión ausente, revocada o vencida
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    HiddenResource:
      description: Recurso desconocido o fuera de ámbito, indistinguibles
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "SEC_SESSION"
  parameters:
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        default: 0
    Size:
      name: "size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    CsrfToken:
      name: "X-CSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 32
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        minLength: 1
  schemas:
    ClosurePreview:
      type: object
      additionalProperties: false
      required: [processId, revision, policyVersion, closureType, blockers, warnings, eligible]
      properties:
        processId: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        policyVersion: {type: string, minLength: 1, maxLength: 100}
        closureType: {type: string, enum: [DOCUMENTARY_CLOSURE, INTEGRAL_CLOSURE]}
        blockers: {type: array, items: {type: string, maxLength: 2000}}
        warnings: {type: array, items: {type: string, maxLength: 2000}}
        eligible: {type: boolean}
    DecisionInput:
      type: "object"
      additionalProperties: false
      required:
        - "authorityAssignmentId"
        - "legalBasis"
        - "documentReference"
        - "reason"
      properties:
        authorityAssignmentId:
          type: "string"
          format: "uuid"
        legalBasis:
          type: "string"
          minLength: 1
          maxLength: 4000
        documentReference:
          type: "string"
          minLength: 1
          maxLength: 2000
        reason:
          type: "string"
          minLength: 10
          maxLength: 4000
    NormativeReference:
      type: "object"
      additionalProperties: false
      required:
        - "title"
        - "issuer"
        - "edition"
        - "documentReference"
        - "disposition"
        - "verificationStatus"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 500
        issuer:
          type: "string"
          minLength: 1
          maxLength: 300
        edition:
          type: "string"
          minLength: 1
          maxLength: 200
        documentReference:
          type: "string"
          minLength: 1
          maxLength: 2000
        disposition:
          type: "string"
          minLength: 1
          maxLength: 2000
        verificationStatus:
          type: "string"
          enum:
            - "PENDING_VALIDATION"
            - "VERIFIED"
        verifiedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    UnitInput:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "name"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
    CareerInput:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "name"
        - "academicUnitId"
        - "validFrom"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
        academicUnitId:
          type: "string"
          format: "uuid"
        validFrom:
          type: "string"
          format: "date"
        validUntil:
          type:
            - "string"
            - "null"
          format: "date"
    StateChange:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "reason"
      properties:
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "DISABLED"
        reason:
          type: "string"
          minLength: 10
          maxLength: 4000
    ModelInput:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "name"
        - "scope"
        - "referenceSet"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
        scope:
          type: "string"
          enum:
            - "GENERAL"
            - "SPECIFIC"
        referenceSet:
          type: "string"
          enum:
            - "GENERAL_2024"
            - "MEDICINE_2018"
            - "NURSING_2016"
            - "DENTISTRY_2018"
            - "LAW_MATRIX"
    VersionInput:
      type: "object"
      additionalProperties: false
      required:
        - "versionLabel"
        - "normativeReferences"
        - "synthetic"
      properties:
        versionLabel:
          type: "string"
          minLength: 1
          maxLength: 100
        versionDate:
          type:
            - "string"
            - "null"
          format: "date"
        normativeReferences:
          type: "array"
          items:
            "$ref": "#/components/schemas/NormativeReference"
        synthetic:
          type: "boolean"
    NodeInput:
      type: "object"
      additionalProperties: false
      required:
        - "parentId"
        - "nodeType"
        - "code"
        - "title"
        - "description"
        - "ordinal"
        - "mandatory"
      properties:
        parentId:
          type:
            - "string"
            - "null"
          format: "uuid"
        nodeType:
          type: "string"
          minLength: 1
          maxLength: 100
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        title:
          type: "string"
          minLength: 1
          maxLength: 300
        description:
          type: "string"
          minLength: 1
          maxLength: 4000
        ordinal:
          type: "integer"
          minimum: 1
        mandatory:
          type: "boolean"
    IndicatorInput:
      type: "object"
      additionalProperties: false
      required:
        - "standardText"
        - "fundamentalElements"
        - "nature"
        - "evaluationPeriodDefinition"
        - "scaleId"
        - "normativeReferences"
      properties:
        standardText:
          type: "string"
          minLength: 1
          maxLength: 20000
        fundamentalElements:
          type: "array"
          items:
            type: "string"
            minLength: 1
            maxLength: 4000
        nature:
          type: "string"
          enum:
            - "QUALITATIVE"
            - "QUANTITATIVE"
        evaluationPeriodDefinition:
          type: "string"
          minLength: 1
          maxLength: 4000
        scaleId:
          type:
            - "string"
            - "null"
          format: "uuid"
        normativeReferences:
          type: "array"
          items:
            "$ref": "#/components/schemas/NormativeReference"
    RequiredSourceInput:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "name"
        - "description"
        - "sourceType"
        - "required"
        - "cardinalityMin"
        - "cardinalityMax"
        - "periodRule"
        - "ordinal"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
        description:
          type: "string"
          minLength: 1
          maxLength: 4000
        sourceType:
          type: "string"
          enum:
            - "FILE"
            - "EXTERNAL_LINK"
            - "STRUCTURED_DATA"
            - "INSTITUTIONAL_REFERENCE"
        required:
          type: "boolean"
        cardinalityMin:
          type: "integer"
          minimum: 1
        cardinalityMax:
          type:
            - "integer"
            - "null"
          minimum: 1
        periodRule:
          type: "string"
          minLength: 1
          maxLength: 4000
        ordinal:
          type: "integer"
          minimum: 1
    VariableDefinition:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "name"
        - "unit"
        - "dataType"
        - "required"
        - "validationDefinition"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
        unit:
          type: "string"
          minLength: 1
          maxLength: 100
        dataType:
          type: "string"
          enum:
            - "DECIMAL"
            - "INTEGER"
        required:
          type: "boolean"
        validationDefinition:
          type: "string"
          minLength: 1
          maxLength: 4000
    Threshold:
      type: "object"
      additionalProperties: false
      required:
        - "ratingOptionId"
        - "lowerBound"
        - "upperBound"
        - "lowerInclusive"
        - "upperInclusive"
      properties:
        ratingOptionId:
          type: "string"
          format: "uuid"
        lowerBound:
          type:
            - "number"
            - "null"
        upperBound:
          type:
            - "number"
            - "null"
        lowerInclusive:
          type: "boolean"
        upperInclusive:
          type: "boolean"
    RuleInput:
      type: "object"
      additionalProperties: false
      required:
        - "ruleType"
        - "methodDefinition"
        - "formulaDefinition"
        - "strategyKey"
        - "strategyVersion"
        - "scaleId"
        - "variables"
        - "thresholds"
        - "missingDataPolicy"
      properties:
        ruleType:
          type: "string"
          enum:
            - "MANUAL_QUALITATIVE"
            - "QUANTITATIVE"
        methodDefinition:
          type: "string"
          minLength: 1
          maxLength: 20000
        formulaDefinition:
          type:
            - "string"
            - "null"
          maxLength: 20000
        strategyKey:
          type:
            - "string"
            - "null"
          maxLength: 200
        strategyVersion:
          type:
            - "string"
            - "null"
          maxLength: 100
        scaleId:
          type:
            - "string"
            - "null"
          format: "uuid"
        variables:
          type: "array"
          items:
            "$ref": "#/components/schemas/VariableDefinition"
        thresholds:
          type: "array"
          items:
            "$ref": "#/components/schemas/Threshold"
        missingDataPolicy:
          type: "string"
          minLength: 1
          maxLength: 4000
    ApplicabilityInput:
      type: "object"
      additionalProperties: false
      required:
        - "careerId"
        - "decision"
        - "validFrom"
        - "validUntil"
        - "provenance"
      properties:
        careerId:
          type: "string"
          format: "uuid"
        decision:
          type: "string"
          enum:
            - "APPLICABLE"
            - "NOT_APPLICABLE"
            - "EXPIRED"
        validFrom:
          type: "string"
          format: "date"
        validUntil:
          type:
            - "string"
            - "null"
          format: "date"
        provenance:
          "$ref": "#/components/schemas/DecisionInput"
    ProcessInput:
      type: "object"
      additionalProperties: false
      required:
        - "careerId"
        - "modelVersionId"
        - "code"
        - "name"
        - "objective"
        - "periodStart"
        - "periodEnd"
        - "synthetic"
      properties:
        careerId:
          type: "string"
          format: "uuid"
        modelVersionId:
          type: "string"
          format: "uuid"
        code:
          type: "string"
          minLength: 1
          maxLength: 100
        name:
          type: "string"
          minLength: 1
          maxLength: 300
        objective:
          type: "string"
          minLength: 1
          maxLength: 4000
        periodStart:
          type: "string"
          format: "date"
        periodEnd:
          type: "string"
          format: "date"
        synthetic:
          type: "boolean"
        duplicateConfirmationReason:
          type:
            - "string"
            - "null"
          maxLength: 4000
    ProcessTransition:
      type: "object"
      additionalProperties: false
      required:
        - "action"
        - "provenance"
        - "expectedState"
      properties:
        action:
          type: "string"
