            - "NOT_CONFIGURED"
            - "NOT_APPLICABLE"
        requiredSourceTotal:
          type: "integer"
          minimum: 0
        registeredSourceTotal:
          type: "integer"
          minimum: 0
        acceptedSourceTotal:
          type: "integer"
          minimum: 0
